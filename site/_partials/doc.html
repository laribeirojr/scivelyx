<!doctype html>
<html lang="{{HTML_LANG}}">
  <head>
{{> head}}
  </head>
  <body>
{{> header}}
    <main id="main" class="container doc-layout">
      <aside class="doc-nav" aria-label="{{T_GUIDE}}">
        <h2>{{T_GUIDE}}</h2>
        <ol>
{{DOC_NAV}}
        </ol>
        <h2>{{T_DOWNLOADS}}</h2>
        <ol>
          <li><a href="{{AROOT}}downloads/{{MANUAL_PDF}}">{{T_MANUAL_PDF}}</a></li>
          <li><a href="{{GRAPHS_RELEASE_URL}}">{{T_LATEST}} (v{{GRAPHS_VERSION}})</a></li>
          <li><a href="{{GRAPHS_ISSUES_URL}}">{{T_REPORT}}</a></li>
        </ol>
      </aside>
      <article class="prose">
{{DOC_BODY}}
        <nav class="doc-pager" aria-label="{{T_PAGES}}">{{DOC_PAGER}}</nav>
      </article>
    </main>
{{> footer}}
  </body>
</html>
