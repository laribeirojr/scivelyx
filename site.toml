# SciTrace-Suite website settings (read by scripts/build_site.py).

[site]
origin = "https://ribeirojr-gh.github.io"
base_path = "/scitrace-studio"

# One table per application. Update "version" when a new release is published.
[apps.graphs]
version = "1.0.0rc4"
release_url = "https://github.com/ribeirojr-gh/scitrace-graphs-releases/releases/latest"
releases_url = "https://github.com/ribeirojr-gh/scitrace-graphs-releases/releases"
issues_url = "https://github.com/ribeirojr-gh/scitrace-graphs-releases/issues"

[guides]
# order of the SciTrace-Graphs guide pages (content/graphs/<name>.md); "index" is the guide's first page
graphs = ["index", "install", "first-graph", "sheet", "editing", "analysis", "origin-tools", "working-tools", "statistics-gadgets", "graph-types", "origin-apps", "matrices", "scripts",
          "migration", "export", "command-line", "faq"]
