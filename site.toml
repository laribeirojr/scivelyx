# SciVelyx Suite website settings (read by scripts/build_site.py).

[site]
origin = "https://laribeirojr.github.io"
base_path = "/scivelyx"

# One table per application. Update "version" when a new release is published.
[apps.graphs]
version = "1.0.0rc7"
release_url = "https://github.com/laribeirojr/scivelyx-graphs-releases/releases/latest"
releases_url = "https://github.com/laribeirojr/scivelyx-graphs-releases/releases"
issues_url = "https://github.com/laribeirojr/scivelyx-graphs-releases/issues"
youtube_url = "https://www.youtube.com/@SciVelyxSuite"

[guides]
# order of the SciVelyx Graphs guide pages (content/graphs/<name>.md); "index" is the guide's first page
graphs = ["index", "install", "interface", "first-graph", "tutorials", "sheet", "editing", "analysis", "spectroscopy",
          "origin-tools", "working-tools", "statistics-gadgets", "graph-types", "origin-apps", "matrices", "scripts",
          "migration", "export", "command-line", "faq"]
