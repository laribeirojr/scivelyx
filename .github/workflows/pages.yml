# Build the SciTrace-Suite website (site/ + content/) and publish it to GitHub Pages.
#
# GitHub Pages must be enabled once in the repository settings with "Source: GitHub Actions"
# (Settings → Pages). The workflow's GITHUB_TOKEN cannot enable it by itself.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/**"
      - "scripts/build_site.py"
      - "site.toml"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the build requirements
        run: python -m pip install -r requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and check the site
        run: python scripts/build_site.py
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
